[project]
name = "syncbaton"
version = "0.1.0"
description = "Check-out / check-in locking for projects in Syncthing-synced folders"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tenacity>=8.2"]

[project.scripts]
syncbaton = "syncbaton.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncbaton"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "W", "C4", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["syncbaton"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 99
